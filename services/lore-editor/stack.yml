version: "3.7"

services:
  lore_editor:
    image: lore-editor:latest
    networks:
      - network_swarm_public
    environment:
      - DATABASE_URL=postgresql://postgres:CHANGE_ME@postgres:5432/postgres
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.http.routers.lore_editor.rule=Host(`lore-editor.clockdesign.com.br`)
        - traefik.http.routers.lore_editor.entrypoints=websecure
        - traefik.http.routers.lore_editor.tls.certresolver=letsencryptresolver
        - traefik.http.routers.lore_editor.service=lore_editor
        - traefik.http.services.lore_editor.loadbalancer.server.port=3000
        - traefik.http.services.lore_editor.loadbalancer.passHostHeader=true
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

networks:
  network_swarm_public:
    name: network_swarm_public
    external: true
